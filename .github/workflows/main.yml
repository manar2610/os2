name: My Workflow

on:
  push:
    branches:
      - master
 

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
       - name: "printing path"
         run: pwd
       - name: "printing name"
         run: echo manar

       - name: "printing files before"
         run: ls
       - uses: actions/checkout@v3

       - name: "printing files after"
         run: ls
       - uses: actions/checkout@v3
       - name: "docker login"
         run: docker login --username ${{secrets.DOCKER_USERNAME}} --password ${{secrets.DOCKER_TOKEN}}